<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RKBACKLES · Screen Preview</title><style>body{margin:0;background:#080c16;color:#eef2ff;font:15px system-ui;padding:24px}.box{max-width:900px;margin:auto;background:#111a2b;border:1px solid #33405d;padding:20px;border-radius:16px}button,select{padding:10px;border-radius:9px;background:#253352;color:white;border:1px solid #52617e}video{width:100%;margin-top:15px;max-height:75vh;background:#020409}p{color:#aebbd3;line-height:1.65}</style></head><body><div class="box"><h1>RKBACKLES Screen Preview</h1><p>Screen share local browser preview; Discord-এর voice channel-এ native Go Live চাইলে Discord Desktop-এ এই window share করতে হবে।</p><button id="start">Choose screen / app</button> <button id="stop" disabled>Stop</button><p id="status">Ready.</p><video id="preview" autoplay muted playsinline></video><script>(()=>{const $=id=>document.getElementById(id);let stream=null;$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});$('preview').srcObject=stream;$('stop').disabled=false;$('status').textContent='Preview চলছে। Discord Desktop-এ এই window share করে Go Live চাপুন।';stream.getVideoTracks()[0].addEventListener('ended',()=>stop());}catch(e){$('status').textContent=e.message||'Screen share failed';}};function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null;$('preview').srcObject=null;$('stop').disabled=true;$('status').textContent='Stopped.';}$('stop').onclick=stop;window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));})();</script></div></body></html>
